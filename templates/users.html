{% extends "base.html" %}

{% block content %}
<h1>пользователи</h1>
<br>
{% for user in all_users %}
<img src="{{user.avatar}}">
<p>{{user.name}}</p>
<p>{{user.id}}</p>
<p>{{user.email}}</p>
<p>{{user.password}}</p>


<form action="{{url_for('del_user', user_id=user.id)}}" method="post">
<button type="submit">удалить пользователя</button>
</form>


{% endfor %}

{% endblock %}
