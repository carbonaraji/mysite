
{% extends "base.html" %}

{% block content %}
<h1>Регистрация пользователя</h1>
<br>
<form action="/register" method="post">
  <label>имя</label><input type="text" name="name" required>

  <br>
  <button type="submit">зарегестрировать пользователя</button>
</form>

{% endblock %}
